<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Discovery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <audio loop autoplay>
        <source src="music/creepyMusic.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <section id="room7">
        <h1 id="room7Title">A table lies in the center of the room, a lone pumpkin resting atop...</h1>

        <img id="ghost6" src="images/ghost1.png">

        <div id="puzzle" class="hidden">
            <h2>Click the items to change their appearance. Make them all match to proceed!</h2>
            <img id="witch-hat" src="images/puzzleImg1.png">
            <img id="doll" src="images/puzzleImg2.png">
            <img id="mirror" src="images/puzzleImg3.png">
        </div>

        <div id="keyContainer" class="hidden">
            <a href="index8.html">
                <img id="key" src="images/key.png" alt="Key to the next room">
            </a>
            <h2>You've found the key! Click it to proceed...</h2>
        </div>

        <br><br><br><br><br><br><br><br><br>
        <img id="pumpkin2" src="images/pumpkin2.png">
    </section>

    <script src="script7.js"></script>
</body>

</html>
